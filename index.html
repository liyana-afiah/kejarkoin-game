<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Space Defender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050814;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Latar belakang tema grid cyber */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.08) 0%, transparent 70%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        /* Header Logo (4 Logo) */
        .header-logos {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(5, 8, 20, 0.9) 0%, rgba(5, 8, 20, 0) 100%);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-item {
            width: 65px;
            height: 65px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.3));
            transition: transform 0.3s ease, filter 0.3s ease;
            border-radius: 8px;
        }

        .logo-item:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.8));
        }

        /* Container Utama Game */
        .main-container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 900px;
            padding: 20px;
            margin: auto;
        }

        .game-title {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #00f0ff;
            text-shadow: 
                0 0 10px #00f0ff,
                0 0 20px #00f0ff,
                0 0 40px rgba(0, 240, 255, 0.6);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 1.2rem;
            color: #d1d5db;
            margin-bottom: 40px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* Tombol Game */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #00d2ff 0%, #a200ff 100%);
            border: none;
            color: #ffffff;
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 220px;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 30px rgba(162, 0, 255, 0.8);
        }

        /* Informasi Kontrol */
        .controls-info {
            font-size: 0.95rem;
            color: #9ca3af;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px 24px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .footer {
            position: relative;
            z-index: 10;
            padding: 20px;
            font-size: 0.85rem;
            color: #6b7280;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="header-logos">
        <div class="logo-group">
            <img src="[BASE64_ONESANDVOSCHO]" alt="ONESANDVOSCHO" class="logo-item">
            <img src="[BASE64_SMKN1SANDEN]" alt="SMKN 1 Sanden" class="logo-item">
        </div>
        <div class="logo-group">
            <img src="[BASE64_RPL]" alt="RPL" class="logo-item">
            <img src="[BASE64_MOKO]" alt="MOKO Game Dev" class="logo-item">
        </div>
    </header>

    <main class="main-container">
        <h1 class="game-title">CYBER SPACE DEFENDER</h1>
        <p class="game-subtitle">Bertahan hidup dari gelombang musuh luar angkasa!</p>

        <div class="button-group">
            <button class="btn" onclick="startGame(1)">1 PLAYER</button>
            <button class="btn" onclick="startGame(2)">2 PLAYER (CO-OP)</button>
        </div>

        <div class="controls-info">
            <b>P1:</b> Panah [↑↓←→] & [Spasi] Tembak &nbsp;|&nbsp; <b>P2:</b> [WASD] & [F] Tembak
        </div>
    </main>

    <footer class="footer">
        &copy; SMKN 1 Sanden - Rekayasa Perangkat Lunak (RPL) & MOKO Game Development Projects
    </footer>

    <script>
        function startGame(players) {
            alert("Memulai permainan mode " + players + " Player!");
        }
    </script>
</body>
</html>
